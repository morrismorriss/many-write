[package]
name = "many-write"
description = "A local-first writing app for plays, screenplays, books, articles and poems."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "many-write"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
manywrite-core = { path = "../crates/manywrite-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde_json = "1"

[features]
# Used by `tauri dev`; do not remove.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri uses; only to switch on WebKitGTK's spell checker.
webkit2gtk = "2.0"
