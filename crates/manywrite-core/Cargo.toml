[package]
name = "manywrite-core"
description = "Core of Many Write: project files on disk and the embedded Typst typesetting engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
serde = { version = "1", features = ["derive"] }
# Importing other formats (all MIT/Apache-2.0, already used by Typst).
hayro-syntax = "0.7"
hayro-interpret = "0.7"
kurbo = "0.13"
roxmltree = "0.21"
miniz_oxide = "0.9"
serde_json = "1"
