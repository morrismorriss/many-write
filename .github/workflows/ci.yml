name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test -p manywrite-core
      - run: cargo build -p many-write
      - name: End-to-end (browser against the dev server)
        run: |
          npx playwright install --with-deps chromium
          npm install --no-save playwright
          cargo build -p manywrite-devserver
          ./target/debug/manywrite-devserver & npx vite --port 1420 &
          npx wait-on http://localhost:1420
          node e2e/smoke.mjs && node e2e/templates.mjs && node e2e/features.mjs && node e2e/imports.mjs && node e2e/writing-extras.mjs && node e2e/updates.mjs && node e2e/binder.mjs && node e2e/sections-citations.mjs
